name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: managed_views_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Core Unit Tests
        run: >-
          dotnet test
          tests/EntityFrameworkCore.ManagedViews.Tests
          --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: PostgreSQL Unit Tests
        run: >-
          dotnet test
          tests/EntityFrameworkCore.ManagedViews.PostgreSQL.Tests
          --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Functional Tests
        run: >-
          dotnet test
          tests/EntityFrameworkCore.ManagedViews.FunctionalTests
          --no-build --configuration Release

      - name: Integration Tests
        run: >-
          dotnet test
          tests/EntityFrameworkCore.ManagedViews.IntegrationTests
          --no-build --configuration Release
        env:
          POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=managed_views_test;Username=test;Password=test"
